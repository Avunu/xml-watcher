name: Verify actions lockfile

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v5.1.0
      with:
        persist-credentials: false

    - name: Install gh-actions-lock
      run: gh extension install github/gh-actions-lock --pin v0.5.1

    - name: Verify actions lockfile
      run: gh actions-lock --verify
